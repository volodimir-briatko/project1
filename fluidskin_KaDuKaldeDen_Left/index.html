<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="ad.size" content="width=800,height=1440">
    <style type="text/css">
        body { margin: 0; padding: 0; -moz-text-size-adjust: none; -ms-text-size-adjust: none; -webkit-text-size-adjust: none; -webkit-tap-highlight-color: transparent; }
        #banner { position: absolute; overflow: hidden; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; visibility: hidden; opacity: 0; background-color: #0d50a0; }
        #banner.on { visibility: visible; opacity: 1; transition: opacity 0.2s linear; }
        #hover { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

        /* Fluid skin panel: always full screen height, any width.
           Video fills the panel (cover, the face is kept by object-position).
           Copy, logo and legal sit on a stage of design units (800 wide, or 520 wide in the narrow layout),
           scaled by s = min(W / stageWidth, H / 1440) and pinned to the panel bottom (see fit()). */
        #vid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 42% 0%; }
        /* bottom gradient, drawn in code (alpha curve sampled from the BG.png supplied with the layout) */
        #grad { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
                background: linear-gradient(to bottom, rgba(13,80,160,0) 0%, rgba(13,80,160,0.06) 13%, rgba(13,80,160,0.26) 26.5%,
                            rgba(13,80,160,0.62) 40%, rgba(13,80,160,0.91) 53%, rgba(13,80,160,0.99) 66%, #0d50a0 100%); }
        #stage { position: absolute; left: 0; top: 0; height: 1440px; transform-origin: 0 0; pointer-events: none; }
        #stage .it { position: absolute; }
        #stage svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
        #logo { background: url("assets/logo_oddset.svg") no-repeat 0 0 / 100% 100%; }
        .wide .nl, .narrow .wl { display: none; }

        /* entrance: copy rises in, the logo follows; legal and badge are static */
        .an { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; transform: translateY(35%); }
        .go .an { animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes rise { to { opacity: 1; transform: none; } }
    </style>
</head>

<script type="text/javascript">
    // Layout in design units. Wide = the 800x1440 layout; narrow = 2-line copy (and stacked legal) on a 520-wide stage.
    // Boxes are [x, y, w, h], y measured on a 1440-high stage that is pinned to the panel bottom.
    var CFG = {"narrowBelow": 280, "wide": {"w": 800, "gradTop": 686, "box": {"h_full": [35.53, 675.13, 729.45, 70.32], "logo": [145, 1145, 510, 108.89]}}, "narrow": {"w": 520, "gradTop": 533.5, "box": {"h_l1": [137.88, 522.5, 244.23, 69.07], "h_l2": [25.24, 626.04, 469.52, 69.96], "logo": [40, 1026, 440, 93.94]}}};

    var banner = document.getElementById("banner"), stage = document.getElementById("stage"), grad = document.getElementById("grad");
    function fit() {
        var W = banner.clientWidth, H = banner.clientHeight;
        var narrow = W < CFG.narrowBelow, L = narrow ? CFG.narrow : CFG.wide;
        var s = Math.min(W / L.w, H / 1440), ox = (W - L.w * s) / 2, oy = H - 1440 * s;
        banner.className = banner.className.replace(/\s*(wide|narrow)/g, "") + (narrow ? " narrow" : " wide");
        stage.style.width = L.w + "px";
        stage.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + s + ")";
        for (var id in L.box) {
            var el = document.getElementById(id), b = L.box[id];
            el.style.left = b[0] + "px"; el.style.top = b[1] + "px"; el.style.width = b[2] + "px"; el.style.height = b[3] + "px";
        }
        grad.style.top = Math.round(oy + L.gradTop * s) + "px";
    }

    function start() {
        if (start.done) return; start.done = true;
        fit();
        banner.className += " on";
        setTimeout(function () { banner.className += " go"; }, 200);
    }
    window.addEventListener("resize", fit);
    window.onload = function () {
        var v = document.getElementById("vid");
        fit();
        // gate: first video frame ready, with a 3 s safety net (the poster covers the wait)
        if (v.readyState >= 2) start(); else v.addEventListener("loadeddata", start);
        setTimeout(start, 3000);
        var p = v.play(); if (p && p.catch) p.catch(function () {});
    };
</script>
