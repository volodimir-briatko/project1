<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="ad.size" content="width=800,height=1440">
    <style type="text/css">
        body { margin: 0; padding: 0; -moz-text-size-adjust: none; -ms-text-size-adjust: none; -webkit-text-size-adjust: none; -webkit-tap-highlight-color: transparent; }
        #banner { position: absolute; overflow: hidden; left: 0; top: 0; width: 100%; height: 100%; cursor: pointer; visibility: hidden; opacity: 0; background-color: #0d50a0; }
        #banner.on { visibility: visible; opacity: 1; transition: opacity 0.2s linear; }
        #hover { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

        /* Fluid skin panel: always full screen height, any width.
           Video fills the panel (cover, the face is kept by object-position).
           Copy, logo and legal sit on a stage of design units (800 wide, or 520 wide in the narrow layout),
           scaled by s = min(W / stageWidth, H / 1440) and pinned to the panel bottom (see fit()). */
        #vid { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }
        /* bottom gradient, drawn in code (alpha curve sampled from the BG.png supplied with the layout) */
        #grad { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
                background: linear-gradient(to bottom, rgba(13,80,160,0) 0%, rgba(13,80,160,0.06) 13%, rgba(13,80,160,0.26) 26.5%,
                            rgba(13,80,160,0.62) 40%, rgba(13,80,160,0.91) 53%, rgba(13,80,160,0.99) 66%, #0d50a0 100%); }
        #stage { position: absolute; left: 0; top: 0; height: 1440px; transform-origin: 0 0; pointer-events: none; }
        #stage .it { position: absolute; }
        #stage svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
        #logo .an { background: url("assets/logo_oddset.svg") no-repeat 0 0 / 100% 100%; }
        .wide .nl, .narrow .wl { display: none; }

        /* animated layers, driven by render(t) in the script; legal and badge are static */
        .an { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; }
    </style>
</head>
<body>

        <div class="it nl" id="h_l1"><div class="an" data-role="head" data-delay="0"><svg viewBox="65.79 55.38 282.27 73.65" preserveAspectRatio="none"><path fill="#fff" filter="url(#sh)" d="M65.794,127.692H86.44L91.2,100.481h0.476l4.567,27.211H118.6l-6.946,-36.25l19.7,-36.06h-21.6L94.813,83.925H94.147L99.19,55.382H78.543ZM120.687,127.692h20.836l3.33,-9.99h11.323l-0.191,9.99h19.886l-0.381,-72.31H146.566ZM149.987,101.527l7.422,-24.071h0.38l-1.046,24.072h-6.756ZM182.617,82.027h13.32l13.511,-26.641H194.419ZM224.571,127.697H245.6c21.5,0,34.062,-12.559,38.058,-35.2s-7.611,-37.106,-27.211,-37.106H237.325ZM249.119,109.429h-0.571l6.279,-35.774H255.4c5.328,0,9.61,5.994,7.517,17.887S254.451,109.424,249.123,109.424ZM310.196,129.029c18.078,0,26.26,-8.182,30.256,-30.827l7.612,-42.815H327.136l-7.707,43.767c-1.427,7.8,-3.235,11.036,-7.231,11.036s-4.662,-3.235,-3.235,-11.036l7.707,-43.767H295.738L288.222,98.2C284.606,118.939,291.361,129.024,310.2,129.024Z"/></svg></div></div>

<script type="text/javascript">
    // Layout in design units. Wide = the 800x1440 layout; narrow = 2-line copy (and stacked legal) on a 520-wide stage.
    // Boxes are [x, y, w, h], y measured on a 1440-high stage that is pinned to the panel bottom.
    var CFG = {"narrowBelow": 280, "video": {"maxTime": 16, "maxPlays": 5, "size": [1280, 1262], "focusX": 0.5, "targetX": 0.5, "focusY": 0.3}, "syncChannel": "oddset-kadu-fluidskin", "anim": {"cycle": 5, "cycles": 3, "headIn": 0.2, "headOut": 4.3, "logoIn": 0.3, "inDur": 0.8, "outDur": 0.4, "outLift": 15}, "wide": {"w": 800, "gradTop": 686, "box": {"h_full": [35, 677.0, 730.0, 68.45], "logo": [145, 1145, 510, 108.89]}}, "narrow": {"w": 520, "gradTop": 535.3, "box": {"h_l1": [131.15, 524.33, 257.7, 67.24], "h_l2": [31.49, 627.89, 457.02, 68.11], "logo": [40, 1026, 440, 93.94]}}};

    var banner = document.getElementById("banner"), stage = document.getElementById("stage"), grad = document.getElementById("grad");
    function fit() {
        var W = banner.clientWidth, H = banner.clientHeight;
        var narrow = W < CFG.narrowBelow, L = narrow ? CFG.narrow : CFG.wide;
        var s = Math.min(W / L.w, H / 1440), ox = (W - L.w * s) / 2, oy = H - 1440 * s;
        banner.className = banner.className.replace(/\s*(wide|narrow)/g, "") + (narrow ? " narrow" : " wide");
        stage.style.width = L.w + "px";
        stage.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + s + ")";
        for (var id in L.box) {
            var el = document.getElementById(id), b = L.box[id];
            el.style.left = b[0] + "px"; el.style.top = b[1] + "px"; el.style.width = b[2] + "px"; el.style.height = b[3] + "px";
        }
        grad.style.top = Math.round(oy + L.gradTop * s) + "px";
        frameVideo(W, H);
    }
    // Footage wider than the panel: scale to cover, then slide it so the face (CFG.video.focusX, share of the
    // frame width) sits at CFG.video.targetX of the panel, never showing past the frame edges.
    var vid = document.getElementById("vid");
    function frameVideo(W, H) {
        var vw = vid.videoWidth || CFG.video.size[0], vh = vid.videoHeight || CFG.video.size[1];
        var k = Math.max(W / vw, H / vh), dw = vw * k, dh = vh * k;
        var x = Math.min(0, Math.max(W - dw, W * CFG.video.targetX - CFG.video.focusX * dw));
        vid.style.objectPosition = Math.round(x) + "px " + Math.round((H - dh) * CFG.video.focusY) + "px";
    }
    vid.addEventListener("loadedmetadata", fit);

    // ---- copy timeline ----
    // Sequence per cycle: left headline in, then the right one (CFG.anim.headIn per panel), both hold, both out, repeat.
    // The last cycle keeps the copy on screen. The frame depends only on t, so panels that share t0 show the same moment.
    var A = CFG.anim, layers = [].slice.call(document.querySelectorAll(".an"));
    function expoOut(x) { return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); }
    function quadIn(x) { return x * x; }
    // window [a, b) of one cycle: rise in over A.inDur from a, fade out over A.outDur from b (b < 0 = stay)
    function apply(el, t, a, b, rise) {
        var o = 0, y = rise;
        if (t >= a) {
            var e = expoOut(Math.min(1, (t - a) / A.inDur));
            o = e; y = rise * (1 - e);
            if (b >= 0 && t >= b) {
                var q = quadIn(Math.min(1, (t - b) / A.outDur));
                o = 1 - q; y = -A.outLift * q;
            }
        }
        el.style.opacity = o.toFixed(3);
        el.style.transform = y ? "translateY(" + y.toFixed(2) + "%)" : "none";
    }
    function render(T) {
        var c = Math.min(Math.floor(T / A.cycle), A.cycles - 1), t = T - c * A.cycle, last = c === A.cycles - 1;
        for (var i = 0; i < layers.length; i++) {
            var el = layers[i], role = el.getAttribute("data-role"), d = +(el.getAttribute("data-delay") || 0);
            if (role === "head") apply(el, t, A.headIn + d, last ? -1 : A.headOut + d, 35);
            else if (role === "logo") apply(el, T, A.logoIn, -1, 35);
        }
    }
    var END = A.cycle * A.cycles;

    // ---- panel sync ----
    // Left, top and right are separate creatives. When they share an origin they agree on the earliest start time
    // through a BroadcastChannel; otherwise each panel simply runs from its own start.
    var t0 = 0, bc = null;
    try { bc = new BroadcastChannel(CFG.syncChannel); } catch (e) { bc = null; }
    if (bc) bc.onmessage = function (m) {
        var o = m.data || {};
        if (o.type !== "t0" || !t0) return;
        if (o.t0 < t0) t0 = o.t0;                                      // someone started earlier: follow them
        else if (o.t0 > t0) bc.postMessage({ type: "t0", t0: t0 });    // a later panel: tell it our start
    };
    function tick() {
        var T = (Date.now() - t0) / 1000;
        render(Math.max(0, T));
        if (T < END + 1) requestAnimationFrame(tick);
    }

    function start() {
        if (start.done) return; start.done = true;
        fit();
        t0 = Date.now() + 200;                                          // copy starts after the 0.2 s reveal
        if (bc) try { bc.postMessage({ type: "t0", t0: t0 }); } catch (e) {}
        render(0);
        banner.className += " on";
        requestAnimationFrame(tick);
    }
    window.addEventListener("resize", fit);
    window.onload = function () {
        var v = document.getElementById("vid");
        fit();
        // gate: first video frame ready, with a 3 s safety net (the poster covers the wait)
        if (v.readyState >= 2) start(); else v.addEventListener("loadeddata", start);
        setTimeout(start, 3000);
        var p = v.play(); if (p && p.catch) p.catch(function () {});
        // Adnami Fluid Skin spec: animation max 30 s, max 5 loops. Each pass always plays to the end;
        // another pass starts only if it still fits both limits, otherwise the video rests on its last frame.
        var plays = 1;
        v.addEventListener("ended", function () {
            if (plays < CFG.video.maxPlays && (plays + 1) * v.duration <= CFG.video.maxTime) {
                plays++;
                v.currentTime = 0;
                var q = v.play(); if (q && q.catch) q.catch(function () {});
            }
        });
    };
</script>
<script>// ADNAMI CLICK TRACKING MACRO - DO NOT MODIFY //

        const clickTagPrefix = "${CLICK_URL}",
            // Landing Page - modify as required
            clickURL = (window.adnmClick) ? window.adnmClick : "https://www.example.com",
            // ID of your clickable HTML element - modify as required
            clickElement = document.getElementById("banner");

        // Click function
        clickElement.addEventListener("click", function (e) {
            const exitUrl = clickTagPrefix + clickURL;
            window.open(exitUrl, '_blank');
        })
