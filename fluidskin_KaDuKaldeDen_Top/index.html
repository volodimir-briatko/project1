        .an { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; transform: translateY(-60%); }
        #head .an { transform: translateY(60%); }
        .go .an { animation: drop 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
