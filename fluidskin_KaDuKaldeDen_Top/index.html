<script type="text/javascript">
    // Per cycle: Oddset logo alone, then KA' DU KALDE DEN? alone; repeat. The last cycle ends back on the logo.
    var CFG = {"syncChannel": "oddset-kadu-fluidskin", "anim": {"cycle": 5, "cycles": 3, "logo": [0.2, 2.2], "head": [2.6, 4.6], "logoBack": 4.9, "inDur": 0.8, "outDur": 0.4}};
    var A = CFG.anim, logoA = document.getElementById("logoA"), headA = document.getElementById("headA");
    function expoOut(x) { return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); }
    function quadIn(x) { return x * x; }
    // window [a, b) of one cycle: rise in over A.inDur from a, fade out over A.outDur from b (b < 0 = stay)
    function apply(el, t, a, b, rise) {
        var o = 0, y = rise;
        if (t >= a) {
            var e = expoOut(Math.min(1, (t - a) / A.inDur));
            o = e; y = rise * (1 - e);
            if (b >= 0 && t >= b) { var q = quadIn(Math.min(1, (t - b) / A.outDur)); o = 1 - q; y = -0.3 * rise * q; }
        }
        el.style.opacity = o.toFixed(3);
        el.style.transform = y ? "translateY(" + y.toFixed(2) + "%)" : "none";
    }
    function render(T) {
        var c = Math.min(Math.floor(T / A.cycle), A.cycles - 1), t = T - c * A.cycle, last = c === A.cycles - 1;
        if (last && t >= A.logoBack) apply(logoA, t, A.logoBack, -1, -40);
        else apply(logoA, t, A.logo[0], A.logo[1], -40);
        apply(headA, t, A.head[0], A.head[1], 40);
    }
    var END = A.cycle * A.cycles;

    // panel sync: the earliest started panel sets t0 for all (see the side panels)
    var t0 = 0, bc = null;
    try { bc = new BroadcastChannel(CFG.syncChannel); } catch (e) { bc = null; }
    if (bc) bc.onmessage = function (m) {
        var o = m.data || {};
        if (o.type !== "t0" || !t0) return;
        if (o.t0 < t0) t0 = o.t0;
        else if (o.t0 > t0) bc.postMessage({ type: "t0", t0: t0 });
    };
    function tick() {
        var T = (Date.now() - t0) / 1000;
        render(Math.max(0, T));
        if (T < END + 1) requestAnimationFrame(tick);
    }
    window.onload = function () {
        var b = document.getElementById("banner");
        t0 = Date.now() + 200;
        if (bc) try { bc.postMessage({ type: "t0", t0: t0 }); } catch (e) {}
        render(0);
        b.className = "on";
        requestAnimationFrame(tick);
    };
</script>
